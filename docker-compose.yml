services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
    ports: ["5432:5432"]
    volumes: ["supportdesk_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    environment:
      PORT: 4000
      DATABASE_URL: postgres://supportdesk:supportdesk@db:5432/supportdesk
      JWT_SECRET: local-development-secret-change-me
      CLIENT_URL: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_SOCKET_URL: http://localhost:4000
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  supportdesk_data:
